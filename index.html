<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Quest Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div id="game-wrapper" class="game-wrapper">
            <div id="survival-game"></div>
        </div>
        <div id="command-container" class="command-container">
            <h2 id="command-label1">CODE QUEST</h2>
            <div id="tutorial-box" class="tutorial-box">
                <img src="assets/images/tutorial_character.webp" alt="Tutorial Character">
                <div>
                    <p id="tutor">สวัสดีผู้กล้า คุณต้องการความช่วยเหลือหรอ? ลองจิ้มดูสิ</p>
                </div>
            </div>
            <div id="command-wrapper" class="command-wrapper">
                <div id="line-numbers"></div>
                <div id="command-label-container">
                    <textarea id="command-label" placeholder="// ใส่คำสั่งตรงนี้ได้เลย" cols="50"></textarea>
                    <div id="autocomplete-suggestions" class="autocomplete-suggestions"></div>
                </div>
            </div>
            <div class="btn-contanier">
                <button id="command-button" class="btn">RUN</button>
            </div>
        </div>
    </div>
    <div id="game-over-dialog" class="modal" style="display:none;">
        <div class="con-dialog">
            <div class="modal-box">
                <p id="game-over-score"></p>
                <div class="modal-action">
                    <button id="back-button" class="btn">ย้อนกลับ</button>
                    <button id="restart-button" class="btn">เริ่มใหม่</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let currentScene = 'map1';
        let suggestionIndex = 0;
    
        const commandsMap = {
            map1: ["player.down(steps)", "player.up(steps)", "player.left(steps)", "player.right(steps)", "player.attack(hits)"],
            map2: ["player.down(steps)", "player.up(steps)", "player.left(steps)", "player.right(steps)", "player.attack(hits)", "loop(int){action}"],
            map3: ["player.down(steps)", "player.up(steps)", "player.left(steps)", "player.right(steps)", "player.attack(hits)", "loop(int){action}", "if else()"]
        };
    
        const updateSuggestions = (lastWord) => {
            const commands = commandsMap[currentScene];
            const matchedCommands = commands.filter(cmd => cmd.startsWith(lastWord));
            suggestionsBox.innerHTML = matchedCommands.map((cmd, index) =>
                `<div class="suggestion ${index === suggestionIndex ? 'selected' : ''}">
            <span class="command">${cmd}</span>
            <span class="press-tab">press tab</span>
        </div>`).join('');
            suggestionsBox.style.display = matchedCommands.length ? 'block' : 'none';
        };
    
        window.switchScene = (sceneName) => {
            currentScene = sceneName;
            suggestionIndex = 0; // รีเซ็ต suggestionIndex ทุกครั้งที่เปลี่ยน scene
            suggestionsBox.style.display = 'none'; // ซ่อนกล่องคำแนะนำเมื่อเปลี่ยน scene
        };
    
        const textarea = document.getElementById('command-label');
        const lineNumbers = document.getElementById('line-numbers');
        const suggestionsBox = document.getElementById('autocomplete-suggestions');
    
        const updateLineNumbers = () => {
            const lines = textarea.value.split('\n').length;
            lineNumbers.innerHTML = Array(lines).fill().map((_, i) => i + 1).join('<br>');
        };
    
        textarea.addEventListener('input', updateLineNumbers);
        textarea.addEventListener('scroll', () => {
            lineNumbers.scrollTop = textarea.scrollTop;
        });
    
        updateLineNumbers();
    
        let messages = [];
        let currentMessageIndex = 0;
    
        const tutorialBox = document.getElementById('tutorial-box');
        const tutorialText = tutorialBox.querySelector('p');
    
        fetch('messages.json')
            .then(response => response.json())
            .then(data => {
                messages = data;
                tutorialBox.style.display = 'block';
            })
            .catch(error => console.error('Error loading messages:', error));
    
        tutorialBox.addEventListener('click', () => {
            if (messages.length > 0) {
                tutorialText.classList.remove('fade-in');
                tutorialText.classList.add('fade-out');
                tutorialText.addEventListener('animationend', () => {
                    tutorialText.classList.remove('fade-out');
                    currentMessageIndex = (currentMessageIndex + 1) % messages.length;
                    tutorialText.textContent = messages[currentMessageIndex];
                    tutorialText.classList.add('fade-in');
                    tutorialText.addEventListener('animationend', () => {
                        tutorialText.classList.remove('fade-in');
                    }, { once: true });
                }, { once: true });
            }
        });
    
        const positionSuggestionsBox = () => {
            const textareaLineHeight = parseInt(window.getComputedStyle(textarea).lineHeight);
            const cursorPosition = textarea.selectionStart;
            const textareaValue = textarea.value.substring(0, cursorPosition);
            const lineNumber = textareaValue.split('\n').length - 1;
            const topPosition = textarea.offsetTop + (lineNumber + 1) * textareaLineHeight - textarea.scrollTop;
            suggestionsBox.style.top = `${topPosition}px`;
        };
    
        textarea.addEventListener('input', function (event) {
            const cursorPos = textarea.selectionStart;
            const textBeforeCursor = textarea.value.substring(0, cursorPos);
            const lastWordMatch = textBeforeCursor.match(/(\w+\.\w+|\w+)$/);
            if (lastWordMatch) {
                const lastWord = lastWordMatch[1];
                suggestionIndex = 0; // Reset to the first suggestion
                updateSuggestions(lastWord);
                positionSuggestionsBox();
            } else {
                suggestionsBox.style.display = 'none';
            }
        });
    
        textarea.addEventListener('keydown', function (event) {
            const suggestions = suggestionsBox.querySelectorAll('.suggestion');
            if (event.key === 'Tab' && suggestions.length > 0) {
                event.preventDefault();
                const cursorPos = textarea.selectionStart;
                const textBeforeCursor = textarea.value.substring(0, cursorPos);
                const lastWordMatch = textBeforeCursor.match(/(\w+\.\w+|\w+)$/);
                if (lastWordMatch && suggestionIndex >= 0) {
                    const lastWord = lastWordMatch[1];
                    const matchedCommand = suggestions[suggestionIndex].querySelector('.command').textContent;
                    const newText = textBeforeCursor.replace(/(\w+\.\w+|\w+)$/, matchedCommand + '\n') + textarea.value.substring(cursorPos);
                    textarea.value = newText;
                    textarea.setSelectionRange(cursorPos + (matchedCommand.length - lastWord.length) + 1, cursorPos + (matchedCommand.length - lastWord.length) + 1);
                    updateLineNumbers();
                    suggestionsBox.style.display = 'none';
                    suggestionIndex = 0; // Reset to the first suggestion
                }
            } else if (event.key === 'ArrowDown' && suggestions.length > 0) {
                event.preventDefault();
                suggestionIndex = (suggestionIndex + 1) % suggestions.length;
                updateSuggestions(textarea.value.substring(0, textarea.selectionStart).match(/(\w+\.\w+|\w+)$/)[1]);
            } else if (event.key === 'ArrowUp' && suggestions.length > 0) {
                event.preventDefault();
                suggestionIndex = (suggestionIndex - 1 + suggestions.length) % suggestions.length;
                updateSuggestions(textarea.value.substring(0, textarea.selectionStart).match(/(\w+\.\w+|\w+)$/)[1]);
            } else if (event.key === 'Enter') {
                suggestionsBox.style.display = 'none';
            }
        });
    </script>
    
    <script src="//cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <script src="//cdn.jsdelivr.net/npm/phaser-matter-collision-plugin"></script>
    <script type="module" src="js/survival-game.js"></script>
</body>

</html>
