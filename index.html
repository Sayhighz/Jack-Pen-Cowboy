<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Game</title>
    <style>
        #command-container {
            position: fixed;
            top: 0;
            right: 0; /* เปลี่ยนจาก left เป็น right */
            width: 300px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            box-sizing: border-box;
        }

        #command-input {
            width: 100%;
            height: 30px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="command-container">
        <input type="text" id="command-input" placeholder="Enter command...">
    </div>
    <div id="survival-game"></div>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <script src="//cdn.jsdelivr.net/npm/phaser-matter-collision-plugin"></script>
    <script type="module" src="js/survival-game.js"></script>
</body>
</html>
