<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Game</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <style>
        #game-wrapper {
            transition: transform 0.3s ease-in-out;
        }

        #command-container {
            display: flex;
            flex-direction: column;
        }

        #command-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        #line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 40px;
            border-right: 1px solid #ccc;
            background: #f7f7f7;
            text-align: right;
            padding-top: 0.7rem;
            padding-right: 10px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            line-height: 20px; /* Adjust line-height to match command-label */
            font-size: 14px; /* Ensure same font-size as command-label */
            color: #999;
            overflow: hidden;
        }

        .line-number {
            display: block;
            height: 20px; /* Adjust height to match line-height of command-label */
        }

        #command-label-container {
            margin-left: 40px;
            flex-grow: 1;
            height: 100%; /* Fill the height of the parent container */
            display: flex;
            flex-direction: column;
        }

        #command-label {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding: 10px;
            margin: 0;
            line-height: 20px; /* Adjust line-height to match line-numbers */
            font-size: 14px; /* Ensure same font-size as line-numbers */
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            box-sizing: border-box;
            resize: vertical; /* Allow vertical resizing */
            min-height: 100%; /* Ensure it fills the container */
        }

    </style>
</head>

<body class="bg-center bg-cover h-screen" style="background-image: url('/assets/images/game_bg.jpg')">
    <div class="container mx-auto flex flex-col md:flex-row justify-center space-x-0 md:space-x-4 space-y-4 md:space-y-0 h-full p-4">
        <div id="game-wrapper" class="w-full md:w-8/12 bg-base-100 bg-opacity-80 rounded-lg shadow-md p-4 flex flex-col">
            <div id="survival-game" class="flex-grow border-2 border-base-300 rounded-lg shadow-md bg-base-200 mb-4">
            </div>
        </div>
        <div id="command-container" class="w-full md:w-4/12 bg-base-100 bg-opacity-80 rounded-lg shadow-md p-4 flex flex-col" style="display: none;">
            <h2 id="command-label1" class="text-lg font-bold text-base-content mb-2 text-center">CODE QUEST</h2>
            <div id="tutorial-box" class="tutorial-box bg-white shadow-lg p-4 border-2 border-black rounded-lg bottom-4 right-4 z-10 mt-4 md:mt-0 md:bottom-auto md:right-auto h-20vh md:h-1/5" style="display: none;">
                <img src="assets/images/tutorial_character.png" alt="Tutorial Character">
                <div class="flex-1">
                    <p class="text-black">
                        คำสั่ง สามารถใส่ตัวเลขจำนวนครั้งได้เช่น right(10)
                        right()           เดินขวา        attack()          โจมตี
                        left()            เดินซ้าย        turn_right()      หันขวา
                        up()              เดินขึ้น         turn_left()       หันซ้าย
                        down()            เดินลง         turn_toface()     หันหน้า
                        turn_yourback()   หันหลัง
                    </p>
                </div>
            </div>
            <div id="command-wrapper" class="mt-5 mb-4">
                <div id="line-numbers"></div>
                <div id="command-label-container" class="h-48">
                    <textarea id="command-label" class="w-full h-full bg-neutral text-neutral-content p-2" placeholder="ใส่คำสั่ง..." rows="33"></textarea>
                </div>
            </div>
            <button id="command-button" class="btn btn-primary w-full mt-2">เริ่ม!</button>
            <!-- Tutorial box -->
        </div>
    </div>
    <div id="game-over-dialog" class="modal modal-open flex items-center justify-center" style="display:none;">
        <div class="modal-box w-1/2 h-1/5">
            <p class="text-base-content mb-4">แพ้แล้ว! เกมจะเริ่มใหม่</p>
            <div class="modal-action mb-5">
                <button class="btn">ย้อนกลับ</button>
            </div>
            <div class="modal-action mt-5">
                <button id="restart-button" class="btn btn-primary">เริ่มใหม่</button>
            </div>
        </div>
    </div>

    <!-- Phaser and custom game scripts -->
    <script src="//cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <script src="//cdn.jsdelivr.net/npm/phaser-matter-collision-plugin"></script>
    <script type="module" src="js/survival-game.js"></script>
    <script>
        const textarea = document.getElementById('command-label');
        const lineNumbers = document.getElementById('line-numbers');

        const updateLineNumbers = () => {
            const lines = textarea.value.split('\n').length;
            lineNumbers.innerHTML = Array(lines).fill().map((_, i) => i + 1).join('<br>');
        };

        textarea.addEventListener('input', updateLineNumbers);
        textarea.addEventListener('scroll', () => {
            lineNumbers.scrollTop = textarea.scrollTop;
        });

        updateLineNumbers();
    </script>
</body>

</html>
